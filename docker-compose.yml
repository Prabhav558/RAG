services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: scorecard
      POSTGRES_USER: scorecard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scorecard"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      SCORECARD_DB_URL: postgresql+psycopg://scorecard:${POSTGRES_PASSWORD:-change-me}@db:5432/scorecard
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SCORECARD_JUDGE_MODEL: ${SCORECARD_JUDGE_MODEL:-openai/gpt-oss-120b}
      SCORECARD_CLARITY_MODEL: ${SCORECARD_CLARITY_MODEL:-openai/gpt-oss-120b}
      SCORECARD_ASSIST_MODEL: ${SCORECARD_ASSIST_MODEL:-openai/gpt-oss-120b}
    ports: ["8000:8000"]
volumes:
  pgdata:
